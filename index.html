<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>画面よみあげ</title>
  <meta name="description" content="スクリーンショットや画面共有から文字を読み取り、音声で読み上げるアプリ">
  <meta name="theme-color" content="#1f5f8b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="よみあげ">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>画面よみあげ</h1>
  </header>

  <main>
    <!-- 1. 取り込み -->
    <section class="card">
      <h2>1. 文字を取り込む</h2>
      <div class="buttons">
        <button id="btnCapture" class="big" type="button">🖥 いまの画面を取り込む</button>
        <button id="btnFile" class="big" type="button">🖼 画像・スクショを選ぶ</button>
        <input id="fileInput" type="file" accept="image/*" hidden>
        <button id="btnPaste" class="big" type="button">📋 貼り付け</button>
      </div>
      <p class="hint" id="captureHint"></p>

      <div id="previewWrap" class="preview" hidden>
        <p class="hint">読みたい部分だけを指でなぞって囲むこともできます（囲まなければ全体を読み取ります）。</p>
        <div class="canvasBox">
          <canvas id="preview"></canvas>
        </div>
        <label class="inline">文字の向き
          <select id="direction">
            <option value="auto">自動で判定</option>
            <option value="h">横書き</option>
            <option value="v">縦書き</option>
          </select>
        </label>
        <div class="buttons">
          <button id="btnOcr" class="big primary" type="button">🔍 文字を読み取る</button>
          <button id="btnClearSel" type="button">囲みを消す</button>
        </div>
        <div id="ocrStatus" class="status" role="status" hidden>
          <progress id="ocrProgress" max="1" value="0"></progress>
          <span id="ocrLabel"></span>
        </div>
      </div>
    </section>

    <!-- 2. テキスト -->
    <section class="card">
      <h2>2. 読み上げる文章</h2>
      <textarea aria-label="読み上げる文章" id="text" rows="8" placeholder="ここに読み取った文字が入ります。直接入力・貼り付けもできます。"></textarea>
      <div id="reader" class="reader" hidden></div>
    </section>

    <!-- 3. 読み上げ -->
    <section class="card">
      <h2>3. 読み上げ</h2>
      <div class="buttons player">
        <button id="btnPlay" class="big primary" type="button">▶ 読み上げ</button>
        <button id="btnPause" class="big" type="button" disabled>⏸ 一時停止</button>
        <button id="btnStop" class="big" type="button" disabled>⏹ 停止</button>
      </div>
      <p id="speechStatus" role="status"></p>
      <p id="voiceStatus" class="hint" role="status"></p>
      <div class="settings">
        <label>声
          <select id="voice"></select>
        </label>
        <label>速さ <output id="rateOut">1.0</output>
          <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1">
        </label>
        <label>高さ <output id="pitchOut">1.0</output>
          <input id="pitch" type="range" min="0.5" max="1.5" step="0.1" value="1">
        </label>
        <label class="check">
          <input id="autoPlay" type="checkbox" checked> 読み取り後すぐに読み上げる
        </label>
      </div>
    </section>
  </main>

  <footer>
    <p>画像の文字認識は端末内で行います。読み上げには、ブラウザが端末内音声と判定した音声だけを使用します。文字認識用のデータは必要に応じて取得します。</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
